
openapi: 3.0.3

info:
  title: Task Manager API
  description: REST API specification for the Task Manager application.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Tasks
    description: Operations related to tasks
  - name: Comments
    description: Operations related to task comments
  - name: Jobs
    description: Operations related to background jobs

paths:
  /api/v1/tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      description: Returns a paginated list of tasks for the authenticated user.
      operationId: listTasks
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - TODO
              - IN_PROGRESS
              - COMPLETED
              - CANCELLED
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum:
              - LOW
              - MEDIUM
              - HIGH
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Tasks
      summary: Create a task
      description: Creates a new task for the authenticated user.
      operationId: createTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  maxLength: 200
                  example: Learn Docker
                description:
                  type: string
                  nullable: true
                  example: Understand Docker Compose and PostgreSQL
                status:
                  type: string
                  enum:
                    - TODO
                    - IN_PROGRESS
                    - COMPLETED
                    - CANCELLED
                  default: TODO
                priority:
                  type: string
                  enum:
                    - LOW
                    - MEDIUM
                    - HIGH
                  default: MEDIUM
                dueDate:
                  type: string
                  format: date
                  nullable: true
                  example: '2026-10-20'
      responses:
        '204':
          description: Task created successfully. No response body is returned.
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Task validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tasks/search:
    get:
      tags:
        - Tasks
      summary: Search tasks
      description: Searches tasks by a text query.
      operationId: searchTasks
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Text to search for in task titles and descriptions
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Missing or invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        description: Unique identifier of the task
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      tags:
        - Tasks
      summary: Get task by ID
      operationId: getTaskById
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Tasks
      summary: Replace a task
      description: Updates all editable fields of an existing task.
      operationId: updateTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - status
                - priority
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                    - TODO
                    - IN_PROGRESS
                    - COMPLETED
                    - CANCELLED
                priority:
                  type: string
                  enum:
                    - LOW
                    - MEDIUM
                    - HIGH
                dueDate:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Tasks
      summary: Partially update a task
      description: Updates only the fields supplied in the request.
      operationId: patchTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                    - TODO
                    - IN_PROGRESS
                    - COMPLETED
                    - CANCELLED
                priority:
                  type: string
                  enum:
                    - LOW
                    - MEDIUM
                    - HIGH
                dueDate:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          description: Task partially updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Empty or invalid update request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Task deleted successfully. No response body is returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tasks/{taskId}/comments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags:
        - Comments
      summary: List task comments
      operationId: listTaskComments
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Comments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Comments
      summary: Create a comment
      operationId: createComment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  minLength: 1
                  example: I have completed the initial Docker setup.
      responses:
        '204':
          description: Comment created successfully. No response body is returned.
        '400':
          description: Invalid comment content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tasks/{taskId}/comments/{commentId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags:
        - Comments
      summary: Get a comment
      operationId: getComment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Comment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Comments
      summary: Delete a comment
      operationId: deleteComment
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Comment deleted successfully. No response body is returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tasks/export:
    post:
      tags:
        - Jobs
      summary: Start task export
      description: Starts an asynchronous CSV export job for the authenticated user.
      operationId: startTaskExport
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - format
              properties:
                format:
                  type: string
                  enum:
                    - CSV
                  example: CSV
      responses:
        '202':
          description: Export job accepted and queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - jobId
                  - status
                properties:
                  jobId:
                    type: string
                    format: uuid
                    example: a1b2c3d4-1111-2222-3333-123456789abc
                  status:
                    type: string
                    enum:
                      - QUEUED
                    example: QUEUED
        '400':
          description: Invalid export request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/jobs/{jobId}:
    get:
      tags:
        - Jobs
      summary: Get job status
      description: Returns the current status and result of an export job.
      operationId: getJobStatus
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: UUID of the export job
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Learn Docker
        description:
          type: string
          nullable: true
          example: Understand Docker Compose
        status:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
        dueDate:
          type: string
          format: date
          nullable: true
          example: '2026-10-20'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - status
        - priority
        - createdAt
        - updatedAt

    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        taskId:
          type: integer
          format: int64
          example: 5
        userId:
          type: integer
          format: int64
          example: 2
        content:
          type: string
          example: I have completed the initial Docker setup.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - taskId
        - userId
        - content
        - createdAt
        - updatedAt

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-1111-2222-3333-123456789abc
        type:
          type: string
          example: TASK_EXPORT
        status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - COMPLETED
            - FAILED
        requestedBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        resultUrl:
          type: string
          format: uri
          nullable: true
        errorMessage:
          type: string
          nullable: true
      required:
        - id
        - type
        - status
        - requestedBy
        - createdAt

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 25
      required:
        - page
        - limit
        - total

    Error:
      type: object
      properties:
        code:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: Authentication token is missing or invalid
      required:
        - code
        - message

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'